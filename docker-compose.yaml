services:
  postgres:
    image: postgres:16-alpine
    container_name: cinemad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: web
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cinemad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d cinemad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
